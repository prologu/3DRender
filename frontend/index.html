<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b0f" />
    <meta name="description" content="轻量、私密的浏览器端 3D Gaussian Splatting 查看器" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Luma Splat · 3DGS Viewer</title>
  </head>
  <body>
    <main id="app">
      <div id="viewport" aria-label="3D Gaussian Splatting 渲染视口"></div>
      <div id="serverViewport" aria-label="服务端 3D Gaussian Splatting 渲染视口">
        <img id="serverFrame" alt="服务端 3DGS 渲染画面" draggable="false" />
        <span id="serverMetrics" class="server-metrics">等待服务端</span>
      </div>
      <div class="ambient" aria-hidden="true"></div>

      <header class="topbar glass">
        <a class="brand" href="./" aria-label="Luma Splat 首页">
          <span class="brand-mark"><i></i><i></i><i></i></span>
          <span>LUMA <b>SPLAT</b></span>
        </a>
        <div class="top-actions">
          <div class="mode-switch" role="group" aria-label="渲染位置">
            <button id="clientMode" class="active" type="button">本地渲染</button>
            <button id="serverMode" type="button">服务端渲染</button>
          </div>
          <span id="webglBadge" class="status-badge"><i></i>检测渲染能力</span>
          <button id="openFileTop" class="button button-primary" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
            打开模型
          </button>
        </div>
      </header>

      <section id="welcome" class="welcome">
        <div class="eyebrow"><span></span> BROWSER-NATIVE 3DGS</div>
        <h1>让空间，<em>在浏览器中重现。</em></h1>
        <p id="welcomeDescription">所有模型均在当前设备本地解析与渲染，不上传服务器。</p>
        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="选择或拖放 3DGS 文件">
          <div class="drop-icon">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M4 15.5v2A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5v-2"/></svg>
          </div>
          <div>
            <strong id="dropTitle">拖放 3DGS 模型到这里</strong>
            <span id="dropSubtitle">或点击从本地选择文件</span>
          </div>
          <div class="format-list"><span>PLY</span><span>SPLAT</span><span>KSPLAT</span><span>SPZ</span></div>
        </div>
        <button id="loadDemo" class="text-button" type="button">没有模型？体验内置示例 <span>→</span></button>
      </section>

      <aside id="modelPanel" class="model-panel glass" aria-label="模型信息">
        <button id="closePanel" class="icon-button panel-close" type="button" aria-label="收起面板">
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <div class="panel-label">CURRENT SCENE</div>
        <div class="file-heading">
          <span id="fileType" class="file-type">PLY</span>
          <div><strong id="fileName">—</strong><span id="fileSize">—</span></div>
        </div>
        <div class="divider"></div>
        <div class="stats-grid">
          <div><span>高斯点数</span><strong id="splatCount">—</strong></div>
          <div><span>实时帧率</span><strong><b id="fpsValue">—</b> FPS</strong></div>
          <div><span>渲染模式</span><strong id="renderModeLabel">3D Gaussian</strong></div>
          <div><span>后端</span><strong id="backendLabel">WebGL 2</strong></div>
        </div>
        <div class="divider"></div>
        <label class="setting-row" for="backgroundSelect">
          <span><b>背景色</b><small>调整视口环境</small></span>
          <select id="backgroundSelect">
            <option value="#090b0f">曜石黑</option>
            <option value="#f0f0ed">雾白</option>
            <option value="#18202b">深海蓝</option>
          </select>
        </label>
        <label class="setting-row" for="qualitySelect">
          <span><b>渲染质量</b><small>影响清晰度与性能</small></span>
          <select id="qualitySelect">
            <option value="high">高清</option>
            <option value="performance">性能</option>
          </select>
        </label>
        <label class="setting-row" for="lodSlider">
          <span><b>高斯加载量</b><small>拖动选择加载点数比例（置信度）</small></span>
          <div class="lod-slider-row">
            <input id="lodSlider" type="range" min="10" max="100" step="5" value="100" />
            <strong id="lodValue" class="lod-value">100%</strong>
          </div>
        </label>
        <div id="privacyNote" class="privacy-note">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 22s8-3 8-10V5l-8-3-8 3v7c0 7 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
          <span><b id="privacyTitle">本地模式</b><span id="privacyText">文件不会离开你的浏览器</span></span>
        </div>
      </aside>

      <div id="toolbar" class="toolbar glass" aria-label="视图工具">
        <button id="togglePanel" class="tool-button active" type="button" aria-label="显示模型信息" title="模型信息">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg>
        </button>
        <span></span>
        <button id="resetView" class="tool-button" type="button" aria-label="重置视角" title="重置视角 (R)">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button id="screenshot" class="tool-button" type="button" aria-label="保存截图" title="保存截图">
          <svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10H4V8Z"/><circle cx="12" cy="12" r="3.5"/></svg>
        </button>
        <button id="fullscreen" class="tool-button" type="button" aria-label="全屏" title="全屏 (F)">
          <svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/></svg>
        </button>
      </div>

      <div id="controlHint" class="control-hint glass"><b>左键</b> 旋转 <i></i><b>滚轮</b> 缩放 <i></i><b>WASD/方向键</b> 前后左右移动</div>

      <div id="navPad" class="nav-pad glass" aria-label="前后左右移动">
        <button class="nav-btn" data-dir="up" type="button" aria-label="向前移动" title="向前 (W)"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
        <button class="nav-btn" data-dir="left" type="button" aria-label="向左移动" title="向左 (A)"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
        <button class="nav-btn nav-btn-center" data-dir="stop" type="button" aria-label="停止移动" title="停止 (按住方向键持续移动)"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
        <button class="nav-btn" data-dir="right" type="button" aria-label="向右移动" title="向右 (D)"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
        <button class="nav-btn" data-dir="down" type="button" aria-label="向后移动" title="向后 (S)"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <div id="loading" class="loading-overlay" role="status" aria-live="polite">
        <div class="loader-orbit"><i></i><i></i><i></i></div>
        <strong id="loadingTitle">正在读取模型</strong>
        <span id="loadingDetail">准备数据…</span>
        <div class="progress-track"><i id="progressBar"></i></div>
        <b id="progressText">0%</b>
      </div>

      <div id="dragOverlay" class="drag-overlay">
        <div><svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M4 15.5v2A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5v-2"/></svg><strong>释放以打开模型</strong></div>
      </div>

      <div id="toast" class="toast" role="alert"></div>
      <input id="fileInput" type="file" accept=".ply,.splat,.ksplat,.spz" hidden />
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
